services:
  api:
    build: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DatabasePath: /data/urlshortener.db
      PublicBaseUrl: http://localhost:3000
    volumes:
      - url-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  url-data:
